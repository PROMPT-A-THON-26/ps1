[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-control-plane"
version = "0.1.0"
description = "Fault-tolerant distributed object storage control plane"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = ["common", "metadata", "replication", "health", "placement", "gateway", "repair", "integrity", "recovery", "rebalance", "storage", "worker"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# CI enforces the critical correctness rules; broader style rules can be enabled incrementally.
select = ["E9", "F63", "F7", "F82"]
