[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-control-plane"
version = "0.1.0"
description = "Fault-tolerant distributed object storage control plane"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = ["common", "metadata", "replication", "health", "placement", "gateway", "repair", "integrity", "recovery", "rebalance"]
