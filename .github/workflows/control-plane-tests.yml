name: Vault control-plane tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q common metadata replication health placement gateway repair integrity recovery rebalance storage worker migrations tests
      - name: Dependency security audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Static quality checks
        run: |
          python -m pip install ruff bandit
          ruff check --select E4,E7,E9,F,B --ignore B904 common metadata replication health placement gateway repair integrity recovery rebalance storage worker migrations
          bandit -q -r common metadata replication health placement gateway repair integrity recovery rebalance storage worker

      - name: Test
        run: pytest -q
