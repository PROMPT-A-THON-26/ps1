services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - vault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d vault"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-node-01:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      VAULT_NODE_ID: node-01
      VAULT_INTERNAL_API_KEY: ${VAULT_INTERNAL_API_KEY:?Set VAULT_INTERNAL_API_KEY}
      VAULT_NODE_HOST: 0.0.0.0
      VAULT_NODE_PORT: 9001
      VAULT_NODE_CAPACITY_BYTES: 10737418240
      VAULT_NODE_CHUNK_SIZE_BYTES: 16777216
      VAULT_NODE_DATA_DIR: /data/vault
      VAULT_NODE_SQLITE_PATH: /var/lib/vault/node_state.sqlite3
    volumes:
      - vault_node_01_data:/data/vault
      - vault_node_01_state:/var/lib/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; r=urllib.request.Request('http://127.0.0.1:9001/internal/v1/health', headers={'X-Internal-API-Key': os.environ['VAULT_INTERNAL_API_KEY']}); d=json.load(urllib.request.urlopen(r, timeout=2)); raise SystemExit(0 if d['status']=='healthy' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  vault-node-02:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      VAULT_NODE_ID: node-02
      VAULT_INTERNAL_API_KEY: ${VAULT_INTERNAL_API_KEY:?Set VAULT_INTERNAL_API_KEY}
      VAULT_NODE_HOST: 0.0.0.0
      VAULT_NODE_PORT: 9001
      VAULT_NODE_CAPACITY_BYTES: 10737418240
      VAULT_NODE_CHUNK_SIZE_BYTES: 16777216
      VAULT_NODE_DATA_DIR: /data/vault
      VAULT_NODE_SQLITE_PATH: /var/lib/vault/node_state.sqlite3
    volumes:
      - vault_node_02_data:/data/vault
      - vault_node_02_state:/var/lib/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; r=urllib.request.Request('http://127.0.0.1:9001/internal/v1/health', headers={'X-Internal-API-Key': os.environ['VAULT_INTERNAL_API_KEY']}); d=json.load(urllib.request.urlopen(r, timeout=2)); raise SystemExit(0 if d['status']=='healthy' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  vault-node-03:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      VAULT_NODE_ID: node-03
      VAULT_INTERNAL_API_KEY: ${VAULT_INTERNAL_API_KEY:?Set VAULT_INTERNAL_API_KEY}
      VAULT_NODE_HOST: 0.0.0.0
      VAULT_NODE_PORT: 9001
      VAULT_NODE_CAPACITY_BYTES: 10737418240
      VAULT_NODE_CHUNK_SIZE_BYTES: 16777216
      VAULT_NODE_DATA_DIR: /data/vault
      VAULT_NODE_SQLITE_PATH: /var/lib/vault/node_state.sqlite3
    volumes:
      - vault_node_03_data:/data/vault
      - vault_node_03_state:/var/lib/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; r=urllib.request.Request('http://127.0.0.1:9001/internal/v1/health', headers={'X-Internal-API-Key': os.environ['VAULT_INTERNAL_API_KEY']}); d=json.load(urllib.request.urlopen(r, timeout=2)); raise SystemExit(0 if d['status']=='healthy' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  vault-node-04:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      VAULT_NODE_ID: node-04
      VAULT_INTERNAL_API_KEY: ${VAULT_INTERNAL_API_KEY:?Set VAULT_INTERNAL_API_KEY}
      VAULT_NODE_HOST: 0.0.0.0
      VAULT_NODE_PORT: 9001
      VAULT_NODE_CAPACITY_BYTES: 10737418240
      VAULT_NODE_CHUNK_SIZE_BYTES: 16777216
      VAULT_NODE_DATA_DIR: /data/vault
      VAULT_NODE_SQLITE_PATH: /var/lib/vault/node_state.sqlite3
    volumes:
      - vault_node_04_data:/data/vault
      - vault_node_04_state:/var/lib/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; r=urllib.request.Request('http://127.0.0.1:9001/internal/v1/health', headers={'X-Internal-API-Key': os.environ['VAULT_INTERNAL_API_KEY']}); d=json.load(urllib.request.urlopen(r, timeout=2)); raise SystemExit(0 if d['status']=='healthy' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  gateway:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/vault
      VAULT_STORAGE_NODES: node-01=http://vault-node-01:9001,node-02=http://vault-node-02:9001,node-03=http://vault-node-03:9001,node-04=http://vault-node-04:9001
      VAULT_NODE_CAPACITY_BYTES: 10737418240
      REPLICATION_FACTOR: 3
      WRITE_QUORUM: 2
      READ_QUORUM: 1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      VAULT_ADMIN_API_KEY: ${VAULT_ADMIN_API_KEY:?Set VAULT_ADMIN_API_KEY}
      VAULT_INTERNAL_API_KEY: ${VAULT_INTERNAL_API_KEY:?Set VAULT_INTERNAL_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-node-01:
        condition: service_healthy
      vault-node-02:
        condition: service_healthy
      vault-node-03:
        condition: service_healthy
      vault-node-04:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-worker:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/vault
      VAULT_STORAGE_NODES: node-01=http://vault-node-01:9001,node-02=http://vault-node-02:9001,node-03=http://vault-node-03:9001,node-04=http://vault-node-04:9001
      REPLICATION_FACTOR: 3
      WRITE_QUORUM: 2
      READ_QUORUM: 1
      HEARTBEAT_INTERVAL_SECONDS: 5
      SUSPECT_AFTER_SECONDS: 15
      UNAVAILABLE_AFTER_SECONDS: 30
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      VAULT_INTERNAL_API_KEY: ${VAULT_INTERNAL_API_KEY:?Set VAULT_INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-node-01:
        condition: service_healthy
      vault-node-02:
        condition: service_healthy
      vault-node-03:
        condition: service_healthy
      vault-node-04:
        condition: service_healthy

  frontend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  vault_postgres_data:
  vault_node_01_data:
  vault_node_01_state:
  vault_node_02_data:
  vault_node_02_state:
  vault_node_03_data:
  vault_node_03_state:
  vault_node_04_data:
  vault_node_04_state:
